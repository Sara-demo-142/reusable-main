name: Post Deployment Workflow
on:
  workflow_call:
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

jobs:
  tagdeploymentVersion:
    name: "Tag Prod Deployment Version"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version and push tag
        id: release_tag_version
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PRERELEASE: false
          TAG_PREFIX: v
          PRERELEASE_SUFFIX: sdlc-${{ github.run_number }}
          RELEASE_BRANCHES: prod
          DEFAULT_BUMP: patch
    outputs:
      bump_version: ${{steps.release_tag_version.outputs.new_tag}}

  createProdBranch:
    name: "Create new branch from Prod"
    runs-on: ubuntu-latest
    needs:
      - tagdeploymentVersion
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create Branch from Prod
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "refs/heads/${{ github.ref_name }}-v${{needs.tagdeploymentVersion.outputs.bump_version}}",
                sha: "${{ github.sha }}"
              });
    outputs:
      new_branch: ${{ github.ref_name }}-v${{needs.tagdeploymentVersion.outputs.bump_version}}
  createDevPR:
    name: "Create PR for DEV branch"
    runs-on: ubuntu-latest
    needs:
      - createProdBranch
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                maintainer_can_modify: true,
                base: "dev",
                head: "${{needs.createProdBranch.outputs.new_branch}}",
                title: 'Merge ${{needs.createProdBranch.outputs.new_branch}} to dev for version update',
                body: 'Merge ${{needs.createProdBranch.outputs.new_branch}} to dev for version update',
              });
  createMainPR:
    name: "Create PR for Main branch"
    runs-on: ubuntu-latest
    needs:
      - tagdeploymentVersion
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                maintainer_can_modify: true,
                base: "main",
                head: "prod",
                title: 'Merge prod to main v${{needs.tagdeploymentVersion.outputs.bump_version}}',
                body: 'Merge prod to main v${{needs.tagdeploymentVersion.outputs.bump_version}}',
              });
